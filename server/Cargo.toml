[package]
name = "server"
version = "1.0.1"
authors = ["Alex Kovalov <alexkovalevkpi@gmail.com>"]
build = "build.rs"

edition = "2024"
rust-version = "1.99.1"

categories = ["network-programming"]
keywords = ["networking", "routers", "monitoring"]

readme = "../README.md"
license = "GPL-3"
repository = "https://github.com/xairaven/xailyser"

[lints]
workspace = true

[dependencies]
common = { path = "../common" }
dpi = { path = "../dpi" }

bytes = "1.12.1"
crossbeam = "0.8.5"
ctrlc = "3.5.2"
fern = "0.7.1"
log = "0.4.34"
pcap = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tungstenite = "0.30.0"
