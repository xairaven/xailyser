[package]
name = "dpi"
version = "1.0.1"
authors = ["Alex Kovalov <alexkovalevkpi@gmail.com>"]
build = "build.rs"

edition = "2024"
rust-version = "1.99.1"

categories = ["network-programming"]
keywords = ["networking", "routers", "monitoring"]

readme = "../README.md"
license = "GPL-3"
repository = "https://github.com/xairaven/xailyser"

[lints]
workspace = true

[dependencies]
csv = "1.4.0"
libc = "0.2.190"
pcap = "2.5.0"
hex = "0.4.3"
num_enum = { version = "0.7.6", features = ["complex-expressions"] }
nom = "8.0.0"
radix-tree = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.21"
