[package]
name = "client"
version = "1.0.1"
authors = ["Alex Kovalov <alexkovalevkpi@gmail.com>"]
build = "build.rs"

edition = "2024"
rust-version = "1.99.1"

categories = ["network-programming"]
keywords = ["networking", "routers", "monitoring"]

readme = "../README.md"
license = "GPL-3"
repository = "https://github.com/xairaven/xailyser"

[lints]
workspace = true

[dependencies]
common = { path = "../common" }
dpi = { path = "../dpi" }

chrono = "0.4.45"
crossbeam = "0.8.5"
egui = "0.31.1"
egui-aesthetix = { git="https://github.com/thebashpotato/egui-aesthetix.git", rev="c26c1dd543819fc46bfebe4cb1f42ee84ed14416", features = ["all_themes"]}
egui_plot = "0.32.1"
eframe = { version = "0.31.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
] }
fern = "0.7.1"
http = "1.5.0"
log = "0.4.34"
pcap = "2.5.0"
rand = "0.10.3"
rfd = "0.17.2"
rust-i18n = "4.2.4"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.21"
toml = "1.1.8"
tungstenite = "0.30.0"
