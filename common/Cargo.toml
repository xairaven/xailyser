[package]
name = "common"
version = "1.0.1"
authors = ["Alex Kovalov <alexkovalevkpi@gmail.com>"]

edition = "2024"
rust-version = "1.99.1"

categories = ["network-programming"]
keywords = ["networking", "routers", "monitoring"]

readme = "../README.md"
license = "GPL-3"
repository = "https://github.com/xairaven/xailyser"

[lints]
workspace = true

[dependencies]
dpi = { path = "../dpi" }

chrono = "0.4.45"
crossbeam = "0.8.5"
directories = "6.0.0"
flate2 = { version = "1.1.10", features = ["zlib-rs"], default-features = false }
hex = "0.4.3"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"